<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script src="assets/words.js"></script>
<script src="lib.js"></script>
<script>
/* Alan Ruschel se despede — cinemático emocional (preto, verde Juventude, ouro) */
const VERDE = '#2ec26a', OURO = '#f2b544', CLARO = '#f3ece0', VERM = '#e3141b';
const A = 'assets/';
const N = window.WORDS.length - 1;
const cut = i => ws(i) - 0.12;
const C = [0, cut(6), cut(13), cut(23), cut(35), cut(43), cut(58), cut(66), cut(75), cut(83), cut(94), cut(104)];
const DUR = Math.ceil((we(N) + 2.0) * 10) / 10;
C.push(DUR);
const S = k => [C[k], C[k + 1]];

const sans = (px, w = 600) => FONTS.sans(px, w);
const W = '#ffffff';
function credito(s, txt) {
  const c = el('div', 'abs', s.el, txt);
  c.style.cssText = 'left:40px;bottom:34px;white-space:nowrap;font:500 15px Inter;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:5px 10px;border-radius:6px';
  return c;
}
function contador(s, x, y, alvo, t0, t1, css) {
  const d = el('div', 'abs', s.el); d.setAttribute('data-evitar', 'contador');
  d.style.cssText = `left:${x}px;top:${y}px;white-space:nowrap;font:400 220px/1 Anton;color:${CLARO};${css || ''};line-height:.8`;
  s.updates.push(t => {
    const p = prog(t, t0, t1); d.textContent = Math.round(alvo * easeOut(p));
    d.style.opacity = t >= t0 ? 1 : 0;
    d.style.transform = `translate(-50%,-50%) scale(${t >= t0 ? lerp(1.25, 1, easeOutExpo(prog(t, t0, t0 + 0.4))) : 0})`;
  });
  return d;
}
function carimbo(s, x, y, txt, t0, cor, rot = -8, px = 52) {
  const st = el('div', 'abs', s.el, txt); st.setAttribute('data-evitar', 'carimbo');
  st.style.cssText = `left:${x}px;top:${y}px;white-space:nowrap;font:400 ${px}px Anton;color:${cor};border:6px solid ${cor};padding:2px 22px;filter:url(#rough);opacity:0`;
  s.updates.push(t => { const q = prog(t, t0, t0 + 0.18);
    st.style.opacity = q > 0 ? 0.95 : 0; st.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scale(${q > 0 ? lerp(2.2, 1, easeOutExpo(q)) : 0})`; });
  return st;
}

/* 1 — gancho */
{
  const s = scene(...S(0), '#000', 0.02);
  bg(s, A + 'ceu.jpg', { z0: 1.25, z1: 1.08, filter: 'brightness(.6) contrast(1.15)' });
  shade(s, 'background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.15), rgba(0,0,0,.85))');
  bloco(s, 640, [
    { seq: [0, 1, { font: sans(56), color: W }] },
    { seq: [2, 3, { font: sans(44), color: '#d8d8d8' }] },
    { seq: [4, 4, { font: FONTS.dms(120, true), color: CLARO, glow: 'rgba(255,255,255,.25)' }] },
    { seq: [5, 5, { font: FONTS.dms(120, true), color: OURO, glow: 'rgba(242,181,68,.45)', from: '#3a2a08' }] }]);
  s.updates.push(t => { if (t > ws(4) && t < ws(4) + 0.25) s.el.style.transform += ` translate(${Math.sin(t * 90) * 5}px,${Math.cos(t * 70) * 4}px)`; });
}

/* 2 — hoje se despede */
{
  const s = scene(...S(1), '#000', 0.02);
  bg(s, A + 'estadio.jpg', { z0: 1.05, z1: 1.18, filter: 'brightness(.55) saturate(1.1)' });
  shade(s, 'background:linear-gradient(180deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.2) 45%, rgba(0,0,0,.75) 100%)');
  bloco(s, 620, [
    { seq: [6, 7, { font: sans(56), color: W }, { 7: { font: FONTS.caps(110), color: OURO, glow: 'rgba(242,181,68,.5)', from: '#3a2a08' } }] },
    { seq: [8, 10, { font: sans(54), color: W }] },
    { seq: [11, 12, { font: sans(54), color: W }, { 12: { font: FONTS.dms(110, true), color: VERDE, glow: 'rgba(46,194,106,.45)', from: '#0a2a14' } }] }]);
}

/* 3 — quem é: polaroid com foto real */
{
  const s = scene(...S(2), 'radial-gradient(ellipse at 50% 35%, #0f3a22 0%, #04110a 75%)', 0.012);
  const pol = el('div', 'abs', s.el, `<img src="${A}foto_alan.jpg" style="width:330px;height:390px;object-fit:cover;object-position:50% 20%;display:block">
    <div style="font:400 40px/1 Anton;color:#1a1a1a;text-align:center;margin-top:16px;white-space:nowrap">ALAN RUSCHEL</div>`);
  pol.setAttribute('data-evitar', 'foto');
  pol.style.cssText = 'left:360px;top:380px;padding:18px 18px 20px;background:#f7f3ea;box-shadow:0 30px 60px rgba(0,0,0,.6)';
  s.updates.push(t => { const p = prog(t, s.start, s.start + 0.6), e = backOut(p);
    pol.style.opacity = p > 0 ? 1 : 0;
    pol.style.transform = `translate(-50%,-50%) translateY(${(1 - e) * -500}px) rotate(${lerp(-18, -4, e)}deg) scale(${1 + (t - s.start) * 0.012})`; });
  bloco(s, 880, [
    { seq: [13, 14, { font: FONTS.dms(86), color: CLARO }] },
    { seq: [15, 17, { font: sans(46), color: W }, { 17: { color: VERDE } }] },
    { line: [[['tem', ws(18)], ['37', ws(19), { font: FONTS.caps(96), color: OURO, from: '#3a2a08' }], ['anos', ws(22)]], { font: sans(46), color: W }] }]);
  credito(s, 'Foto: Sirli Freitas/Chapecoense · Wikimedia Commons (CC BY 2.0)');
}

/* 4 — 2016, o voo */
{
  const s = scene(...S(3), '#000', 0.015);
  bg(s, A + 'ceu.jpg', { z0: 1.0, z1: 1.15, filter: 'brightness(.45) grayscale(.3)', py: -30 });
  shade(s, 'background:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.35) 50%, rgba(0,0,0,.85))');
  bloco(s, 480, [
    { line: [[['Em', ws(23)], ['2016', ws(24), { font: FONTS.caps(120), color: OURO, from: '#3a2a08' }]], { font: sans(50), color: W }] },
    { seq: [28, 30, { font: sans(46), color: W }] },
    { seq: [31, 31, { font: FONTS.dms(96, true), color: VERDE, glow: 'rgba(46,194,106,.4)', from: '#0a2a14' }] },
    { seq: [32, 34, { font: sans(50), color: W }, { 34: { color: CLARO } }] }]);
  const svg = el('div', 'abs', s.el, `<svg width="720" height="400" viewBox="0 0 720 400">
    <path id="rota" d="M60 60 C 260 20, 420 40, 520 180 S 600 330, 610 350" fill="none" stroke="${VERM}" stroke-width="6" stroke-linecap="round"/>
    <g id="xis" stroke="${VERM}" stroke-width="9" stroke-linecap="round" opacity="0"><line x1="590" y1="330" x2="630" y2="370"/><line x1="630" y1="330" x2="590" y2="370"/></g></svg>`);
  svg.style.cssText = 'left:0;top:700px';
  const path = svg.querySelector('#rota'), xis = svg.querySelector('#xis'); const L = 760;
  s.updates.push(t => { const p = easeInOut(prog(t, ws(29), ws(32) + 0.2));
    path.setAttribute('stroke-dasharray', `${L * p} ${L}`); xis.setAttribute('opacity', t > ws(32) + 0.2 ? 1 : 0); });
  const tp = typer(s.el, 'left:360px;top:1130px;transform:translateX(-50%);white-space:nowrap;font:400 30px Type;color:#d9cfbf', '29 . NOV . 2016', ws(25), 14);
  s.updates.push(t => tp.at(t));
}

/* 5 — 71 mortos, 6 sobreviventes */
{
  const s = scene(...S(4), '#000', 0.012);
  bg(s, A + 'velas.jpg', { z0: 1.15, z1: 1.03, filter: 'brightness(.42) saturate(.9)' });
  shade(s, 'background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,.25), rgba(0,0,0,.85))');
  const c71 = contador(s, 360, 0, 71, ws(35), ws(38), 'font-size:250px;text-shadow:0 10px 40px rgba(0,0,0,.7)');
  bloco(s, 640, [
    { el: c71, h: 215 },
    { seq: [38, 39, { font: sans(52), color: W }] },
    { gap: 24 },
    { line: [[['Só', ws(40)], ['6', ws(41), { font: FONTS.caps(120), color: VERDE, glow: 'rgba(46,194,106,.5)', from: '#0a2a14' }]], { font: sans(52), color: W }] },
    { seq: [42, 42, { font: FONTS.dms(84, true), color: CLARO }] }]);
}

/* 6 — voltou a jogar, único que seguiu */
{
  const s = scene(...S(5), '#000', 0.015);
  bg(s, A + 'tunel.jpg', { z0: 1.0, z1: 1.22, filter: 'brightness(.5)' });
  shade(s, 'background:linear-gradient(180deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.7) 100%)');
  const out = ws(47) - 0.1;
  bloco(s, 600, [
    { seq: [43, 44, { font: sans(56), color: W, outAt: out }] },
    { seq: [45, 46, { font: sans(56), color: W, outAt: out }, { 46: { font: FONTS.dms(100, true), color: VERDE, glow: 'rgba(46,194,106,.45)', from: '#0a2a14' } }] }]);
  bloco(s, 600, [
    { seq: [47, 50, { font: sans(50), color: W }, { 50: { color: OURO } }] },
    { seq: [51, 51, { font: FONTS.dms(92, true), color: VERDE, glow: 'rgba(46,194,106,.45)', from: '#0a2a14' }] },
    { seq: [52, 54, { font: sans(46), color: W }] },
    { seq: [55, 57, { font: sans(46), color: W }, { 55: { color: CLARO } }] }]);
  carimbo(s, 360, 840, 'O ÚLTIMO EM CAMPO', ws(55), OURO, -6, 50);
}

/* 7 — 19 temporadas, 411 jogos */
{
  const s = scene(...S(6), '#000', 0.015);
  bg(s, A + 'chuteiras.jpg', { z0: 1.12, z1: 1.0, filter: 'brightness(.42)', origin: '50% 80%' });
  shade(s, 'background:linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,.5) 50%, rgba(0,0,0,.8))');
  const c19 = contador(s, 360, 0, 19, ws(59), ws(60), `color:${OURO};font-size:200px`);
  const c411 = contador(s, 360, 0, 411, ws(62), ws(65), `color:${VERDE};font-size:200px`);
  bloco(s, 640, [
    { seq: [58, 58, { font: sans(50), color: W }] },
    { el: c19, h: 175 },
    { seq: [60, 60, { font: FONTS.dms(74, true), color: CLARO }] },
    { gap: 20 },
    { el: c411, h: 175 },
    { seq: [65, 65, { font: FONTS.dms(74, true), color: CLARO }] }]);
}

/* 8 — duas cirurgias */
{
  const s = scene(...S(7), '#000', 0.015);
  bg(s, A + 'joelho.jpg', { z0: 1.05, z1: 1.16, filter: 'brightness(.45) saturate(.6)', origin: '50% 70%' });
  shade(s, 'background:linear-gradient(180deg, rgba(4,10,20,.85) 0%, rgba(4,10,20,.55) 60%, rgba(0,0,0,.8) 100%)');
  const b8 = bloco(s, 600, [
    { seq: [66, 68, { font: sans(48), color: W }] },
    { line: [[['2', ws(69), { font: FONTS.caps(120), color: VERM, from: '#3a0608' }], ['cirurgias', ws(70), { font: FONTS.dms(88, true), color: CLARO }]], {}] },
    { seq: [71, 72, { font: sans(52), color: W }] },
    { seq: [73, 74, { font: FONTS.hand(64), color: OURO }] }]);
  const u = el('div', 'abs', s.el, `<svg width="420" height="40"><path d="M6 24 C 120 8, 280 34, 412 14" fill="none" stroke="${VERM}" stroke-width="7" stroke-linecap="round" style="filter:url(#rough)"/></svg>`);
  u.style.cssText = `left:150px;top:${parseFloat(b8[1].L.style.top) + 40}px`;
  const up = u.querySelector('path'); const UL = 430;
  s.updates.push(t => { const p = easeOut(prog(t, ws(70) + 0.2, ws(70) + 0.6)); up.setAttribute('stroke-dasharray', `${UL * p} ${UL}`); });
}

/* 9 — a frase */
{
  const s = scene(...S(8), '#020805', 0.02);
  bg(s, A + 'foto_alan.jpg', { z0: 1.2, z1: 1.32, filter: 'grayscale(1) brightness(.32) contrast(1.1)', origin: '50% 25%' });
  shade(s, 'background:linear-gradient(180deg, rgba(0,0,0,.35), rgba(2,20,10,.75) 60%, rgba(0,0,0,.9))');
  const q = el('div', 'abs', s.el, '“'); q.style.cssText = `left:70px;top:250px;font:900 italic 300px/1 Play;color:${VERDE};opacity:0;transform-origin:30% 30%`;
  s.updates.push(t => { const p = pop(t, s.start + 0.05, 0.4); q.style.opacity = p > 0 ? .55 : 0; q.style.transform = `scale(${p})`; });
  bloco(s, 660, [
    { seq: [75, 76, { font: FONTS.dms(76, true), color: CLARO, text: { 75: '“Não' } }] },
    { seq: [77, 78, { font: FONTS.dms(76, true), color: CLARO }] },
    { seq: [79, 81, { font: FONTS.dms(76, true), color: CLARO }] },
    { seq: [82, 82, { font: FONTS.dms(118, true), color: OURO, glow: 'rgba(242,181,68,.5)', from: '#3a2a08', text: { 82: 'corpo”' } }] }]);
  credito(s, 'Foto: Sirli Freitas/Chapecoense · Wikimedia Commons (CC BY 2.0)');
  s.updates.push(t => { if (t > ws(82) && t < ws(82) + 0.2) s.el.style.transform += ` translate(${Math.sin(t * 120) * 6}px,0)`; });
}

/* 10 — último jogo hoje */
{
  const s = scene(...S(9), '#000', 0.018);
  bg(s, A + 'estadio.jpg', { z0: 1.2, z1: 1.05, filter: 'brightness(.5) saturate(1.2)' });
  shade(s, 'background:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.3) 50%, rgba(0,0,0,.8))');
  bloco(s, 540, [
    { seq: [83, 85, { font: sans(52), color: W }, { 84: { font: FONTS.dms(86, true), color: OURO } }] },
    { seq: [86, 87, { font: sans(52), color: W }, { 87: { font: FONTS.caps(130), color: VERDE, glow: 'rgba(46,194,106,.55)', from: '#0a2a14' } }] },
    { seq: [88, 90, { font: sans(48), color: W }, { 90: { color: CLARO } }] },
    { seq: [91, 93, { font: sans(48), color: W }] }]);
  const pl = el('div', 'abs', s.el, `<div style="font:700 18px Inter;letter-spacing:.2em;color:${OURO};margin-bottom:10px">SÉRIE B · ÚLTIMA RODADA</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:22px;font:400 46px/1 Anton;color:#fff">
      <span>JUVENTUDE</span><span style="color:${VERDE};font-size:36px">×</span><span>BOTAFOGO-SP</span></div>
    <div style="font:600 20px Inter;color:#cfcfcf;margin-top:12px">SÁB · 14/11 · ALFREDO JACONI</div>`);
  pl.setAttribute('data-evitar', 'placar');
  pl.style.cssText = 'left:360px;top:880px;width:600px;text-align:center;padding:24px 18px;background:rgba(6,20,12,.88);border:2px solid rgba(46,194,106,.6);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.6);white-space:nowrap';
  s.updates.push(t => { const p = pop(t, ws(90), 0.4); pl.style.opacity = p > 0 ? 1 : 0; pl.style.transform = `translate(-50%,-50%) scale(${p})`; });
}

/* 11 — acesso à Série A */
{
  const s = scene(...S(10), '#000', 0.02);
  bg(s, A + 'tunel.jpg', { z0: 1.1, z1: 1.45, filter: 'brightness(.55) saturate(1.2)', origin: '50% 55%' });
  shade(s, 'background:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.35) 50%, rgba(0,0,0,.75))');
  const big = { font: FONTS.caps(120), color: OURO, glow: 'rgba(242,181,68,.5)', from: '#3a2a08' };
  bloco(s, 580, [
    { seq: [94, 96, { font: sans(52), color: W }] },
    { seq: [97, 98, { font: sans(52), color: W }, { 98: { font: FONTS.dms(100, true), color: VERDE, glow: 'rgba(46,194,106,.5)', from: '#0a2a14' } }] },
    { seq: [99, 100, { font: sans(52), color: W }] },
    { seq: [101, 103, { font: sans(52), color: W }, { 102: big, 103: big }] }]);
  const ar = el('div', 'abs', s.el, `<svg width="90" height="110" viewBox="0 0 90 110"><path d="M45 5 L85 55 H60 V105 H30 V55 H5 Z" fill="${VERDE}"/></svg>`);
  ar.setAttribute('data-evitar', 'seta'); ar.style.cssText = 'left:360px;top:880px';
  s.updates.push(t => { const p = prog(t, ws(102), ws(102) + 0.5); ar.style.opacity = p > 0 ? 1 : 0;
    ar.style.transform = `translate(-50%,-50%) translateY(${(1 - easeOutExpo(p)) * 120 + Math.sin(t * 6) * 8}px)`; });
}

/* 12 — CTA */
{
  const s = scene(...S(11), 'radial-gradient(ellipse at 50% 40%, #0f3a22 0%, #020a05 75%)', 0.01);
  bloco(s, 560, [
    { seq: [104, 105, { font: sans(54), color: W }, { 105: { font: FONTS.dms(96, true), color: CLARO } }] },
    { seq: [106, 106, { font: FONTS.hand(80), color: OURO }] },
    { gap: 16 },
    { seq: [107, 109, { font: sans(48), color: W }] },
    { seq: [110, 110, { font: FONTS.dms(96, true), color: VERDE, glow: 'rgba(46,194,106,.5)', from: '#0a2a14' }] },
    { seq: [111, 112, { font: sans(48), color: W }] }]);
  const card = el('div', 'abs', s.el, `<div style="display:flex;gap:16px;align-items:flex-start">
      <div style="width:56px;height:56px;border-radius:50%;background:${VERDE};display:flex;align-items:center;justify-content:center"><img src="${tw('1f49a')}" style="width:32px"></div>
      <div style="flex:1"><div style="font:700 20px Inter;color:#111">você</div><div id="cm" style="font:500 26px/1.3 Inter;color:#222;min-height:34px;white-space:nowrap"></div></div>
      <img src="${tw('2764')}" style="width:30px;margin-top:6px"></div>`);
  card.setAttribute('data-evitar', 'comentario');
  card.style.cssText = 'left:360px;top:920px;width:600px;padding:22px 24px;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.6)';
  const cm = card.querySelector('#cm'); const msg = 'Obrigado por tudo, guerreiro! 👏';
  s.updates.push(t => { const t0 = ws(112); const p = pop(t, t0, 0.4);
    card.style.opacity = p > 0 ? 1 : 0; card.style.transform = `translate(-50%,-50%) scale(${p}) rotate(-1.5deg)`;
    const chars = [...msg]; cm.textContent = chars.slice(0, Math.floor(clamp((t - t0 - 0.35) * 22, 0, chars.length))).join(''); });
}

finalize({ duration: DUR, grain: 0.07, vignette: 0.5, preload: [A + 'foto_alan.jpg'],
  flashes: [[C[1], 0.15], [C[2], 0.12], [C[3], 0.15, '227,20,27'], [C[4], 0.12], [C[5], 0.12], [C[6], 0.12], [C[7], 0.12], [C[8], 0.15], [C[9], 0.12], [C[10], 0.12], [C[11], 0.15, '46,194,106']] });
</script>
</body></html>
