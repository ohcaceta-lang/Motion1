<script>
/* Tech em alta — 3 notícias da semana. Estilo: tech noturno (azul-noite + verde-lima), Inter + Anton,
   objetos recortados flutuando, marca-texto, cursor clicando, barra de capítulos (referências do Pinterest). */
const LIMA = '#c6f432', NOITE = '#06080d', BRANCO = '#ffffff', CINZA = '#8b93a5';
const A = 'assets/';
const N = window.WORDS.length - 1;
const W = i => ws(i) - 0.12;
const DUR = Math.ceil((we(N) + 2.2) * 10) / 10;
const T = [0, W(11), W(20), W(35), W(49), W(61), W(67), W(79), W(93), W(99), W(110), W(119), W(128), DUR];

const sans = (px, wt = 700) => FONTS.sans(px, wt);
const caps = px => FONTS.caps(px);

/* ---------- helpers ---------- */
function techBg(s, c1 = '#1d3b8a', c2 = '#3f6b12') {
  const b1 = el('div', 'abs', s.el), b2 = el('div', 'abs', s.el), g = el('div', 'abs', s.el);
  b1.style.cssText = `width:900px;height:900px;border-radius:50%;background:radial-gradient(circle, ${c1}cc 0%, transparent 65%);filter:blur(20px)`;
  b2.style.cssText = `width:800px;height:800px;border-radius:50%;background:radial-gradient(circle, ${c2}aa 0%, transparent 65%);filter:blur(20px)`;
  g.style.cssText = `inset:-120px;background-image:linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);background-size:60px 60px`;
  s.updates.push(t => {
    const k = t - s.start;
    b1.style.transform = `translate(${-300 + Math.sin(t * 0.6) * 120}px, ${-260 + Math.cos(t * 0.45) * 140}px)`;
    b2.style.transform = `translate(${220 + Math.cos(t * 0.5) * 140}px, ${620 + Math.sin(t * 0.7) * 120}px)`;
    g.style.transform = `translateY(${(k * 18) % 60}px)`;
  });
}
function whipIn(s, dir = 1, d = 0.24) {
  s.updates.push(t => {
    const p = prog(t, s.start, s.start + d); if (p >= 1) return;
    const e = easeOutExpo(p);
    s.el.style.transform += ` translateX(${dir * (1 - e) * 240}px)`;
    s.el.style.filter = `blur(${(1 - e) * 16}px)`;
  });
}
function obj(s, src, x, y, w, t0, o = {}) {
  const im = el('img', 'abs', s.el); im.src = src;
  im.style.cssText = `left:${x}px;top:${y}px;width:${w}px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55)) ${o.glow ? `drop-shadow(0 0 30px ${o.glow})` : ''};opacity:0`;
  s.updates.push(t => {
    const p = pop(t, t0, o.d || 0.5); const k = t - t0;
    const fl = Math.sin(k * (o.fs || 1.6)) * (o.float ?? 10);
    const rot = (o.rot || 0) + Math.sin(k * 1.1) * (o.wob ?? 3) + (1 - clamp(p)) * (o.spin ?? -25);
    const dy = (o.drop ?? 160) * (1 - easeOutExpo(prog(t, t0, t0 + 0.45)));
    im.style.opacity = t >= t0 ? clamp(prog(t, t0, t0 + 0.12)) : 0;
    im.style.transform = `translate(-50%,-50%) translateY(${fl - dy}px) rotate(${rot}deg) scale(${p * (o.sc || 1)}) ${o.extra ? o.extra(t) : ''}`;
  });
  return im;
}
function mark(s, rec, k, t0, cor = LIMA) {   // marca-texto que varre a palavra
  const it = rec.items[k], sp = it.sp; it.color = '#0a0c10'; it.from = '#0a0c10'; it.glow = null;
  sp.style.backgroundImage = `linear-gradient(${cor}, ${cor})`; sp.style.backgroundRepeat = 'no-repeat';
  sp.style.padding = '0 12px'; sp.style.borderRadius = '10px'; sp.style.backgroundSize = '0% 100%';
  s.updates.push(t => { sp.style.backgroundSize = `${easeOutExpo(prog(t, t0, t0 + 0.3)) * 100}% 100%`; });
}
function tag(s, txt, t0, y = 150) {      // etiqueta de capítulo
  const d = el('div', 'abs', s.el, txt);
  d.style.cssText = `left:360px;top:${y}px;white-space:nowrap;font:400 34px/1 Anton;letter-spacing:.08em;color:#0a0c10;background:${LIMA};padding:12px 24px 10px;border-radius:999px;opacity:0`;
  s.updates.push(t => { const p = pop(t, t0, 0.4); d.style.transform = `translate(-50%,-50%) scale(${p})`; d.style.opacity = t >= t0 ? 1 : 0; });
}
function cursor(s, x0, y0, x1, y1, t0, t1) {
  const c = el('div', 'abs', s.el, `<svg width="54" height="54" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.4-7.6L20.5 11z" fill="#fff" stroke="#0a0c10" stroke-width="1.4" stroke-linejoin="round"/></svg>`);
  const ring = el('div', 'abs', s.el); ring.style.cssText = `width:70px;height:70px;border-radius:50%;border:4px solid ${LIMA};opacity:0`;
  c.style.left = '0px'; c.style.top = '0px'; ring.style.left = '0px'; ring.style.top = '0px';
  s.updates.push(t => {
    const p = easeInOut(prog(t, t0, t1));
    const x = lerp(x0, x1, p), y = lerp(y0, y1, p) - Math.sin(p * Math.PI) * 60;
    const click = prog(t, t1, t1 + 0.16), sc = 1 - Math.sin(click * Math.PI) * 0.22;
    c.style.transform = `translate(${x}px, ${y}px) scale(${sc})`;
    c.style.opacity = t >= t0 ? clamp(prog(t, t0, t0 + 0.15)) * (1 - prog(t, t1 + 0.7, t1 + 0.9)) : 0;
    const r = prog(t, t1, t1 + 0.45);
    ring.style.transform = `translate(${x1 - 35}px, ${y1 - 35}px) scale(${0.3 + r * 1.3})`;
    ring.style.opacity = r > 0 && r < 1 ? 1 - r : 0;
  });
}
function pill(s, txt, x, y, t0, o = {}) {
  const d = el('div', 'abs', s.el, txt);
  d.style.cssText = `left:${x}px;top:${y}px;white-space:nowrap;font:${o.font || '700 30px Inter'};color:${o.color || BRANCO};background:${o.bg || 'rgba(255,255,255,.08)'};border:2px solid ${o.border || 'rgba(255,255,255,.25)'};padding:${o.pad || '12px 24px'};border-radius:999px;backdrop-filter:blur(8px);opacity:0`;
  s.updates.push(t => { const p = pop(t, t0, 0.4); d.style.transform = `translate(-50%,-50%) rotate(${o.rot || 0}deg) scale(${p})`; d.style.opacity = t >= t0 ? 1 : 0; });
  return d;
}
function big(s, txt, x, y, px, cor, t0) {   // número gigante vazado no fundo
  const d = el('div', 'abs', s.el, txt);
  d.style.cssText = `left:${x}px;top:${y}px;white-space:nowrap;font:400 ${px}px/1 Anton;color:transparent;-webkit-text-stroke:3px ${cor};opacity:0`;
  s.updates.push(t => { const p = easeOutExpo(prog(t, t0, t0 + 0.8)); d.style.opacity = p * 0.3; d.style.transform = `translate(-50%,-50%) scale(${1.25 - p * 0.25 + Math.max(0, t - t0) * 0.01})`; });
}
