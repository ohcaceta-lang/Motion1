<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script src="assets/words.js"></script>
<script src="lib.js"></script>
<script>
/* Peña / Paraguai — estilo da referência branding-why-storytelling-earnedits:
   uma "cena-mundo" por frase (tela de bloqueio, HUD técnico, refletor, visor REC, jornal, lousa a giz,
   martelo, porão, alerta, dossiê, barra de busca), zoom para dentro da notificação, fonte própria por cena. */
const RED = '#e3141b', GOLD = '#f2c14e', A = 'assets/';
const N = window.WORDS.length - 1;
const CUT = i => ws(i) - 0.12;
const C = [0, CUT(5), CUT(15), CUT(18), CUT(24), CUT(31), CUT(45), CUT(58), CUT(68), CUT(77), CUT(91), CUT(97), CUT(105)];
const DUR = Math.ceil((we(N) + 2.0) * 10) / 10;
const END = k => (k + 1 < C.length ? C[k + 1] : DUR);
const CRED_WIKI = 'Foto: Gabinete Presidencial de Taiwan / Wikimedia Commons (CC BY 4.0)';

/* ---------- helpers de cena ---------- */
function credito(s, txt, cor = 'rgba(255,255,255,.75)') {
  const d = el('div', 'abs', s.el, txt);
  d.style.cssText = `left:24px;bottom:22px;font:500 15px Inter;color:${cor};white-space:nowrap;letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.6)`;
  return d;
}
function ilustr(s) {
  const d = el('div', 'abs', s.el, 'IMAGEM ILUSTRATIVA');
  d.style.cssText = 'right:22px;top:24px;font:700 13px Inter;letter-spacing:.14em;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.45);padding:5px 10px;border-radius:4px;white-space:nowrap';
}
function foto(s, src, css, filtro = 'grayscale(1) contrast(1.15)') {
  const f = el('div', 'abs', s.el); f.dataset.evitar = 'foto';
  f.style.cssText = css + ';overflow:hidden';
  const im = el('img', '', f); im.src = src;
  im.style.cssText = `width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:${filtro}`;
  return f;
}
function notif(s, titulo, corpo, top) {
  const n = el('div', 'abs', s.el, `<div style="display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:11px;background:${RED};display:flex;align-items:center;justify-content:center;font:900 24px Inter;color:#fff">!</div>
      <div style="flex:1"><div style="display:flex;justify-content:space-between;font:700 19px Inter;color:#111"><span>${titulo}</span><span style="font-weight:500;color:#777;font-size:16px">agora</span></div>
      <div style="font:500 19px/1.3 Inter;color:#222;margin-top:3px">${corpo}</div></div></div>`);
  n.dataset.evitar = 'notificação';
  n.style.cssText = `left:50px;top:${top}px;width:620px;padding:18px 20px;border-radius:26px;background:rgba(245,245,247,.93);box-shadow:0 18px 40px rgba(0,0,0,.45);opacity:0`;
  return n;
}
function cantos(s, cor = 'rgba(255,255,255,.55)') {
  const c = el('div', 'abs', s.el); c.style.cssText = 'inset:0;pointer-events:none';
  [[34, 34, 'top', 'left'], [34, 34, 'top', 'right'], [34, 34, 'bottom', 'left'], [34, 34, 'bottom', 'right']].forEach(([a, b, v, h]) => {
    const k = el('div', 'abs', c); k.style.cssText = `${v}:${a}px;${h}:${b}px;width:44px;height:44px;border-${v}:3px solid ${cor};border-${h}:3px solid ${cor}`;
  });
  return c;
}

/* ===== 1. GANCHO — tela de bloqueio, notificação chega e a câmera entra nela ===== */
{
  const s = scene(C[0], C[1], 'radial-gradient(ellipse at 50% 0%, #6b0d12 0%, #2a0507 45%, #070102 100%)', 0.012);
  const glow = shade(s, 'background:radial-gradient(circle at 80% 95%, rgba(227,20,27,.35), transparent 55%)');
  const hora = el('div', 'abs', s.el, '<div style="font:500 26px Inter;color:rgba(255,255,255,.8)">terça-feira, 3 de novembro</div><div style="font:200 150px/1 Inter;color:#fff;letter-spacing:-.04em">23:41</div>');
  hora.style.cssText = 'left:360px;top:120px;transform:translateX(-50%);text-align:center;white-space:nowrap';
  const n = notif(s, 'URGENTE · PARAGUAI', 'Banco Central intervém no Ueno Bank', 360);
  bloco(s, 700, [
    { seq: [0, 1, { font: FONTS.sans(56, 600), color: '#ffffff', outAt: C[1] - 0.32 }] },
    { seq: [2, 3, { font: FONTS.sans(56, 600), color: '#ffffff', outAt: C[1] - 0.32 }] },
    { seq: [4, 4, { font: FONTS.caps(160), color: RED, glow: 'rgba(227,20,27,.55)', from: '#4a0508', outAt: C[1] - 0.32 }] },
  ]);
  s.updates.push(t => {
    const p = pop(t, 0.05, 0.45);
    n.style.opacity = t > 0.05 ? 1 : 0; n.style.transform = `translateY(${(1 - p) * -60}px) scale(${0.9 + 0.1 * p})`;
    glow.style.opacity = 0.6 + 0.4 * Math.sin(t * 6);
    const z = prog(t, C[1] - 0.3, C[1]);                       // zoom para dentro da notificação
    if (z > 0) { s.el.style.transformOrigin = '50% 33%'; s.el.style.transform = `scale(${1 + easeIn(z) * 5})`; s.el.style.filter = `blur(${z * 6}px)`; }
  });
}

/* ===== 2. HUD técnico — o presidente ===== */
{
  const s = scene(C[1], C[2], '#17181b', 0.018);
  shade(s, 'background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px');
  shade(s, 'background:radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.08), rgba(0,0,0,.6) 75%)');
  cantos(s);
  const reg = el('div', 'abs', s.el, 'CASO UENO // PY-2026 // ARQ. 0311');
  reg.style.cssText = 'left:24px;top:640px;transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center;font:600 14px Inter;letter-spacing:.3em;color:rgba(255,255,255,.4);white-space:nowrap;margin-left:12px';
  const regua = el('div', 'abs', s.el); regua.style.cssText = 'right:34px;top:300px;width:14px;height:600px;background:repeating-linear-gradient(rgba(255,255,255,.4) 0 2px,transparent 2px 20px)';
  const f = foto(s, A + 'pena1.jpg', 'left:200px;top:130px;width:320px;height:420px;border:2px solid rgba(255,255,255,.7)');
  const tag = el('div', 'abs', f, 'PRESIDENTE · 2023');
  tag.style.cssText = 'left:10px;top:10px;font:700 15px Inter;letter-spacing:.12em;background:#fff;color:#111;padding:4px 8px;white-space:nowrap';
  const faixa = el('div', 'abs', f, 'DESTITUÍDO');
  faixa.style.cssText = `left:-40px;top:300px;width:420px;text-align:center;background:${RED};color:#fff;font:400 44px Anton;letter-spacing:.06em;transform:rotate(-10deg) scaleX(0);white-space:nowrap`;
  const mira = el('div', 'abs', s.el); mira.style.cssText = 'left:360px;top:300px;width:150px;height:150px;border:2px dashed rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)';
  bloco(s, 790, [
    { seq: [5, 7, { font: FONTS.sans(44, 500), color: '#b9bcc4' }] },
    { seq: [8, 11, { font: FONTS.sans(54, 700), color: '#ffffff' }] },
    { seq: [12, 13, { font: FONTS.sans(54, 700), color: '#ffffff' }] },
    { seq: [14, 14, { font: FONTS.caps(130), color: RED, glow: 'rgba(227,20,27,.45)', from: '#3a0608' }] },
  ]);
  credito(s, CRED_WIKI);
  s.updates.push(t => {
    const a = easeOutExpo(prog(t, C[1], C[1] + 0.5));
    s.el.style.filter = `blur(${(1 - a) * 8}px)`;
    const m = prog(t, C[1], ws(9) + 0.4);
    mira.style.transform = `translate(-50%,-50%) scale(${lerp(2.4, 1, easeOut(m))}) rotate(${t * 40}deg)`; mira.style.opacity = 1 - prog(t, ws(12), ws(12) + 0.2);
    const q = prog(t, ws(12), ws(12) + 0.22);
    faixa.style.transform = `rotate(-10deg) scaleX(${easeOutExpo(q)})`;
  });
}

/* ===== 3. Refletor — E foi preso (grades descem) ===== */
{
  const s = scene(C[2], C[3], 'radial-gradient(ellipse at 50% -5%, #3d6d78 0%, #173038 40%, #081216 85%)', 0.02);
  shade(s, 'background:conic-gradient(from 180deg at 50% -10%, transparent 160deg, rgba(255,255,255,.12) 172deg, rgba(255,255,255,.12) 188deg, transparent 200deg)');
  const f = foto(s, A + 'pena2.jpg', 'left:220px;top:150px;width:280px;height:380px;box-shadow:0 20px 50px rgba(0,0,0,.6)');
  const grades = el('div', 'abs', f); grades.style.cssText = 'left:0;top:0;width:100%;height:100%;background:repeating-linear-gradient(90deg,transparent 0 30px,#1a1a1a 30px 44px);box-shadow:inset 0 14px 0 #1a1a1a;transform:translateY(-100%)';
  bloco(s, 740, [
    { seq: [15, 16, { font: FONTS.sans(62, 700), color: '#ffffff' }] },
    { seq: [17, 17, { font: FONTS.caps(180), color: '#ffffff', glow: 'rgba(255,255,255,.35)' }] },
  ]);
  credito(s, CRED_WIKI);
  s.updates.push(t => {
    const p = prog(t, ws(17), ws(17) + 0.25);
    grades.style.transform = `translateY(${(1 - backOut(p)) * -100}%)`;
    if (p > 0 && p < 1) s.el.style.transform += ` translateY(${Math.sin(t * 90) * 5 * (1 - p)}px)`;
  });
}

/* ===== 4. Visor de câmera REC — agora, no Paraguai ===== */
{
  const s = scene(C[3], C[4], '#000', 0.015);
  bg(s, A + 'buscas.jpg', { z0: 1.25, z1: 1.1, px: -30, filter: 'brightness(.5) contrast(1.1) saturate(.8)' });
  shade(s, 'background:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.65))');
  cantos(s, 'rgba(255,255,255,.85)');
  const rec = el('div', 'abs', s.el, `<span id="recdot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${RED};margin-right:10px;vertical-align:-2px"></span>REC · AO VIVO`);
  rec.style.cssText = 'left:70px;top:70px;font:700 24px Inter;color:#fff;white-space:nowrap';
  const loc = el('div', 'abs', s.el, 'ASSUNÇÃO · PY'); loc.style.cssText = 'right:70px;top:72px;font:600 22px Inter;color:#fff;letter-spacing:.1em;white-space:nowrap';
  const grid = el('div', 'abs', s.el); grid.style.cssText = 'left:60px;top:150px;width:600px;height:980px;background-image:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.6%,transparent 66.8%),linear-gradient(transparent 33.2%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.6%,transparent 66.8%)';
  const b = bloco(s, 650, [
    { seq: [18, 19, { font: FONTS.sans(50, 600), color: '#ffffff' }] },
    { seq: [20, 22, { font: FONTS.sans(46, 600), color: '#ffffff' }] },
    { seq: [23, 23, { font: FONTS.caps(130), color: '#ffffff' }] },
  ]);
  const flag = el('div', 'abs', s.el); flag.style.cssText = `left:360px;width:330px;height:18px;transform:translateX(-50%) scaleX(0);background:linear-gradient(${RED} 0 33%,#fff 33% 66%,#0038a8 66%)`;
  credito(s, 'Foto: Daniel Duarte / AFP');
  s.updates.push(t => {
    document.getElementById('recdot').style.opacity = Math.sin(t * 8) > 0 ? 1 : 0.2;
    const q = prog(t, ws(23) + 0.15, ws(23) + 0.45);
    flag.style.top = (parseFloat(b[2].L.style.top) + 82) + 'px';
    flag.style.transform = `translateX(-50%) scaleX(${easeOutExpo(q)})`;
  });
}

/* ===== 5. Banco — a porta de aço desce ===== */
{
  const s = scene(C[4], C[5], '#000', 0.02);
  bg(s, A + 'banco.jpg', { z0: 1.05, z1: 1.18, filter: 'brightness(.6) saturate(.8)' });
  const porta = el('div', 'abs', s.el); porta.style.cssText = 'left:0;top:0;width:720px;height:1280px;background:repeating-linear-gradient(#3b3f45 0 34px,#2a2d31 34px 38px,#4a4f56 38px 40px);opacity:.92;transform:translateY(-100%)';
  shade(s, 'background:radial-gradient(ellipse at 50% 52%, rgba(0,0,0,.55), rgba(0,0,0,.1) 70%)');
  const st = el('div', 'abs', s.el, 'INSOLVÊNCIA');
  st.style.cssText = `left:360px;white-space:nowrap;font:400 54px Anton;letter-spacing:.06em;color:${RED};border:5px solid ${RED};padding:0 20px;filter:url(#rough);opacity:0;background:rgba(0,0,0,.35)`;
  bloco(s, 650, [
    { seq: [24, 26, { font: FONTS.sans(54, 700), color: '#ffffff' }] },
    { seq: [27, 28, { font: FONTS.sans(54, 700), color: '#ffffff' }] },
    { seq: [29, 30, { font: FONTS.caps(128), color: '#ffffff' }, { 30: { font: FONTS.caps(128), color: RED, glow: 'rgba(227,20,27,.5)' } }] },
    { gap: 26 },
    { el: st, h: 120 },
  ]);
  ilustr(s);
  s.updates.push(t => {
    const p = prog(t, ws(27), ws(27) + 0.55);
    porta.style.transform = `translateY(${(easeIn(p) - 1) * 100}%)`;
    if (p >= 1 && t < ws(27) + 0.75) s.el.style.transform += ` translateY(${Math.sin(t * 80) * 6}px)`;
    const q = prog(t, ws(30) + 0.35, ws(30) + 0.53);
    st.style.opacity = q > 0 ? 0.95 : 0; st.style.transform = `translate(-50%,-50%) rotate(-6deg) scale(${q > 0 ? lerp(2.2, 1, easeOutExpo(q)) : 0})`;
  });
}

/* ===== 6. Jornal — três milhões, metade do país ===== */
{
  const s = scene(C[5], C[6], '#e8dfcb', 0.014);
  el('div', 'abs', s.el, '<svg width="720" height="1280"><rect width="100%" height="100%" filter="url(#paperF)"/></svg>').style.cssText = 'left:0;top:0;opacity:.9';
  const mast = el('div', 'abs', s.el, `<div style="font:900 italic 64px Play;color:#141414;letter-spacing:-.01em">O Diário da Crise</div>
    <div style="margin-top:10px;border-top:3px solid #141414;border-bottom:1px solid #141414;padding:6px 0;font:600 16px Inter;letter-spacing:.2em;color:#141414">EDIÇÃO EXTRA · ASSUNÇÃO · NOVEMBRO DE 2026</div>`);
  mast.style.cssText = 'left:50px;top:90px;width:620px;text-align:center';
  const cols = el('div', 'abs', s.el); cols.style.cssText = 'left:50px;top:960px;width:620px;height:250px;display:flex;gap:22px';
  for (let c = 0; c < 3; c++) el('div', '', cols).style.cssText = 'flex:1;background:repeating-linear-gradient(rgba(20,20,20,.28) 0 7px,transparent 7px 17px)';
  el('div', 'abs', s.el).style.cssText = 'left:50px;top:930px;width:620px;border-top:2px solid #141414';
  const num = el('div', 'abs', s.el); num.style.cssText = 'left:360px;font:400 124px/1 Anton;color:#141414;white-space:nowrap;transform:translate(-50%,-50%)';
  const mk = el('div', 'abs', s.el); mk.style.cssText = `left:360px;height:84px;width:520px;background:${GOLD};transform-origin:0 50%;mix-blend-mode:multiply`;
  const ink = { color: '#141414', from: '#cfc5ae' };
  const b = bloco(s, 650, [
    { el: num, h: 146 },
    { seq: [34, 35, { font: FONTS.dms(56), ...ink }] },
    { seq: [36, 38, { font: FONTS.caps(76), color: RED, from: '#e6b5ad' }] },
    { seq: [39, 41, { font: FONTS.dms(50), ...ink }] },
    { seq: [42, 44, { font: FONTS.dms(50), ...ink }, { 44: { font: FONTS.dms(50, true), color: RED, from: '#e6b5ad' } }] },
  ]);
  s.el.insertBefore(mk, b[1].L);
  s.updates.push(t => {
    const p = prog(t, ws(32), we(33) + 0.1);
    const v = Math.round(3000000 * easeOut(p));
    num.textContent = v.toLocaleString('pt-BR'); num.style.opacity = t >= ws(32) - 0.05 ? 1 : 0;
    const q = prog(t, ws(36) + 0.05, we(38));
    mk.style.top = (parseFloat(b[1].L.style.top) - 38) + 'px';
    mk.style.transform = `translateX(-50%) scaleX(${easeOut(q)})`; mk.style.transformOrigin = '0 50%';
    mk.style.left = '100px'; mk.style.transform = `scaleX(${easeOut(q)})`;
  });
}

/* ===== 7. Ficha HUD sobre dinheiro caindo — acionista até 2025 ===== */
{
  const s = scene(C[6], C[7], '#000', 0.016);
  bg(s, A + 'dinheiro.jpg', { z0: 1.0, z1: 1.15, py: 60, filter: 'brightness(.42) contrast(1.1)' });
  const card = el('div', 'abs', s.el); card.dataset.evitar = 'ficha';
  card.style.cssText = 'left:60px;top:150px;width:600px;height:300px;background:rgba(18,20,24,.82);border:1px solid rgba(255,255,255,.35);border-radius:16px;backdrop-filter:blur(6px);box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden';
  const im = el('img', 'abs', card); im.src = A + 'pena1.jpg'; im.style.cssText = 'left:20px;top:20px;width:190px;height:260px;object-fit:cover;object-position:50% 15%;filter:grayscale(1) contrast(1.1);border-radius:8px';
  const head = el('div', 'abs', card, 'FICHA · CASO UENO'); head.style.cssText = `left:232px;top:24px;font:800 16px Inter;letter-spacing:.18em;color:${GOLD};white-space:nowrap`;
  const linhas = [['NOME', 'Santiago Peña', ws(45)], ['CARGO', 'ex-presidente', ws(46) + 0.2], ['VÍNCULO', 'acionista do banco', ws(48)], ['ATÉ', '2025', ws(52)]];
  const typers = linhas.map(([k, v, t0], i) => {
    const lab = el('div', 'abs', card, k); lab.style.cssText = `left:232px;top:${66 + i * 54}px;font:600 13px Inter;letter-spacing:.16em;color:rgba(255,255,255,.5)`;
    return typer(card, `left:232px;top:${82 + i * 54}px;font:700 26px Inter;color:#fff;white-space:nowrap`, v, t0, 30);
  });
  const b = bloco(s, 720, [
    { seq: [45, 46, { font: FONTS.caps(88), color: '#ffffff' }] },
    { seq: [47, 48, { font: FONTS.sans(54, 600), color: '#ffffff' }, { 48: { font: FONTS.sans(54, 800), color: GOLD } }] },
    { seq: [49, 50, { font: FONTS.sans(54, 600), color: '#ffffff' }] },
    { line: [[['até', ws(51) - 0.04, { font: FONTS.sans(54, 600) }], ['2025', ws(52) - 0.04, { font: FONTS.caps(86), color: GOLD, glow: 'rgba(242,193,78,.4)' }]], { color: '#ffffff' }] },
  ]);
  credito(s, CRED_WIKI);
  s.updates.push(t => {
    const p = pop(t, C[6] + 0.05, 0.5);
    card.style.transform = `perspective(900px) rotateX(${(1 - p) * 30}deg) scale(${0.8 + 0.2 * p})`; card.style.opacity = clamp(p * 2);
    typers.forEach(x => x.at(t));
  });
}

/* ===== 8. Lousa a giz — a suspeita ===== */
{
  const s = scene(C[7], C[8], '#1b130c', 0.012);
  bg(s, A + 'lousa.jpg', { z0: 1.12, z1: 1.04, filter: 'brightness(.9)' });
  const chalk = { color: '#f2efe6', from: '#5d7a6a' };
  const b = bloco(s, 650, [
    { line: [[['A suspeita:', C[7] + 0.1]], { font: FONTS.hand(64), color: GOLD, from: '#5d7a6a' }] },
    { seq: [58, 61, { font: FONTS.hand(56), ...chalk }] },
    { seq: [62, 64, { font: FONTS.hand(54), ...chalk }] },
    { seq: [65, 66, { font: FONTS.hand(58), ...chalk }] },
    { seq: [67, 67, { font: FONTS.hand(98), color: GOLD, from: '#5d7a6a' }] },
  ]);
  const svg = el('div', 'abs', s.el, `<svg width="720" height="1280"><path id="giz" d="M220 0 C 300 -8, 420 10, 500 -2" fill="none" stroke="#f2c14e" stroke-width="7" stroke-linecap="round" filter="url(#rough)"/>
    <g id="moeda" fill="none" stroke="#f2efe6" stroke-width="4" filter="url(#rough)"><circle cx="560" cy="0" r="34"/><path d="M560 -20 v40 M572 -12 c-8 -8 -26 -4 -24 4 c2 10 26 4 26 14 c0 10 -20 12 -28 4"/></g></svg>`);
  svg.style.cssText = 'left:0;top:0;pointer-events:none';
  const giz = svg.querySelector('#giz'), moeda = svg.querySelector('#moeda');
  const L = giz.getTotalLength(); giz.style.strokeDasharray = L;
  s.updates.push(t => {
    const y = parseFloat(b[4].L.style.top) + 58;
    giz.setAttribute('transform', `translate(0 ${y})`);
    giz.style.strokeDashoffset = L * (1 - easeOut(prog(t, we(67), we(67) + 0.4)));
    const y2 = parseFloat(b[0].L.style.top);
    moeda.setAttribute('transform', `translate(0 ${y2})`); moeda.style.opacity = prog(t, C[7] + 0.3, C[7] + 0.6) * 0.9;
  });
}

/* ===== 9. Martelo — tentou renunciar, impeachment ===== */
{
  const s = scene(C[8], C[9], '#071a1f', 0.02);
  bg(s, A + 'martelo.jpg', { z0: 1.0, z1: 1.14, py: -40, filter: 'brightness(.5)' });
  shade(s, 'background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.55), rgba(0,0,0,.15) 75%)');
  const st = el('div', 'abs', s.el, 'IMPEACHMENT');
