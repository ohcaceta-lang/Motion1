<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script src="assets/words.js"></script>
<script src="assets/fotos.js"></script>
<script src="lib.js"></script>
<script>
/* Estilo 5 — colagem editorial vermelha (polêmica). Tudo em função de t. */
const COR = '#e3141b', CLARO = '#efe6d6', VINHO = '#5a0a0e';
const A = 'assets/';
const N = window.WORDS.length - 1;
const FOTO_DIRA = window.FOTO_DIRA || null;
const CUT = i => ws(i) - 0.12;
const C = [0, CUT(5), CUT(11), CUT(23), CUT(34), CUT(39), CUT(45), CUT(53), CUT(62), CUT(69), CUT(79), CUT(89)];
const DUR = Math.ceil((we(N) + 2.0) * 10) / 10;
const SANS = sz => FONTS.sans(sz, 700);
const KEY = { color: COR, glow: 'rgba(227,20,27,.55)', from: '#3a0608' };

// tratamento único de todas as imagens: P&B + duotone vinho + retícula
function collage(s, src, o = {}) {
  bg(s, A + src, Object.assign({ filter: 'grayscale(1) contrast(1.25) brightness(.85)' }, o));
  shade(s, `background:${VINHO};mix-blend-mode:multiply;opacity:.7`);
  el('div', 'ht', s.el);
  shade(s, 'background:linear-gradient(180deg, rgba(20,2,3,.55) 0%, rgba(20,2,3,.15) 35%, rgba(20,2,3,.25) 65%, rgba(20,2,3,.8) 100%)');
}
function credito(s, txt) {
  const c = el('div', 'abs', s.el, txt);
  c.style.cssText = 'left:24px;bottom:22px;white-space:nowrap;font:600 15px Inter;color:rgba(239,230,214,.75);letter-spacing:.02em';
}
function carimbo(s, txt, x, y, t0, rot = -8, size = 70) {
  const st = el('div', 'abs', s.el, txt);
  st.setAttribute('data-evitar', 'carimbo');
  st.style.cssText = `left:${x}px;top:${y}px;white-space:nowrap;font:400 ${size}px/1.1 Anton;color:${COR};border:7px solid ${COR};padding:6px 24px;filter:url(#rough);opacity:0;background:rgba(10,0,0,.35)`;
  s.updates.push(t => {
    const q = prog(t, t0, t0 + 0.18);
    st.style.opacity = q > 0 ? 0.95 : 0;
    st.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scale(${q > 0 ? lerp(2.4, 1, easeOutExpo(q)) : 0})`;
    if (q > 0 && q < 1) s.el.style.transform += ` translate(${Math.sin(t * 90) * 6 * (1 - q)}px, ${Math.cos(t * 70) * 6 * (1 - q)}px)`;
  });
  return st;
}
// interrogações gigantes orbitando ao fundo
function interrog(s, n = 3) {
  for (let k = 0; k < n; k++) {
    const q = el('div', 'abs', s.el, '?');
    q.style.cssText = `left:0;top:0;font:900 italic ${260 + k * 90}px Play;color:rgba(227,20,27,.13)`;
    s.updates.push(t => { const a = t * 0.5 + k * 2.1; q.style.transform = `translate(${360 + Math.cos(a) * 250 - 90}px, ${620 + Math.sin(a * 0.8) * 420 - 200}px) rotate(${Math.sin(a) * 20}deg)`; });
  }
}

/* 1 — gancho */
{
  const s = scene(C[0], C[1], '#000', 0.02);
  collage(s, 'estudio.jpg', { z0: 1.25, z1: 1.05 });
  seq(s, 360, 560, 0, 2, { font: SANS(56), color: '#ffffff' });
  seq(s, 360, 680, 3, 4, { font: SANS(56), color: '#ffffff' }, { 4: { font: FONTS.serif(110), ...KEY } });
}
/* 2 — Nordeste revoltado */
{
  const s = scene(C[1], C[2], '#000', 0.025);
  collage(s, 'sertao.jpg', { z0: 1.05, z1: 1.2, py: -30 });
  seq(s, 360, 470, 5, 7, { font: SANS(56), color: '#ffffff' }, { 7: { font: FONTS.caps(96), color: CLARO } });
  seq(s, 360, 600, 8, 9, { font: SANS(56), color: '#ffffff' });
  seq(s, 360, 740, 10, 10, { font: FONTS.serif(124), ...KEY });
  const e = el('img', 'abs', s.el); e.src = tw('1f621');
  e.style.cssText = 'left:360px;top:970px;width:150px;height:150px';
  s.updates.push(t => { const p = pop(t, we(10), 0.4); e.style.transform = `translate(-50%,-50%) scale(${p}) rotate(${Math.sin(t * 18) * 6}deg)`; });
}
/* 3 — a novela e a estreia */
{
  const s = scene(C[2], C[3], '#000', 0.02);
  collage(s, 'tv.jpg', { z0: 1.3, z1: 1.08 });
  seq(s, 360, 330, 11, 12, { font: FONTS.caps(100), color: CLARO, text: { 11: 'LÁ', 12: 'NA' } });
  seq(s, 360, 475, 13, 14, { font: FONTS.caps(100), color: CLARO, text: { 13: 'MINHA', 14: 'TERRA' } }, { 14: { font: FONTS.caps(100), color: COR } });
  seq(s, 360, 610, 15, 17, { font: SANS(52), color: '#ffffff' });
  seq(s, 360, 710, 18, 19, { font: SANS(52), color: '#ffffff' });
  const card = el('div', 'abs', s.el); card.setAttribute('data-evitar', 'calendario');
  card.style.cssText = `left:360px;top:950px;width:240px;height:250px;background:${CLARO};border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.7)`;
  card.innerHTML = `<div style="height:62px;background:${COR};font:400 34px/62px Anton;color:#fff;text-align:center;letter-spacing:.08em">NOV 2026</div>
    <div style="font:400 150px/185px Anton;color:#1a0505;text-align:center">9</div>`;
  s.updates.push(t => { const p = pop(t, ws(20) - 0.05, 0.4); card.style.opacity = t > ws(20) - 0.05 ? 1 : 0; card.style.transform = `translate(-50%,-50%) scale(${p}) rotate(${lerp(-14, -4, clamp(p))}deg)`; });
}
/* 4 — os estereótipos */
{
  const s = scene(C[3], C[4], '#000', 0.02);
  collage(s, 'sertao.jpg', { z0: 1.3, z1: 1.1, px: 30 });
  const L = (i0, i1, y, rot) => { const r = seq(s, 360, y, i0, i1, { font: FONTS.caps(70), color: CLARO }); r.extra = () => `rotate(${rot}deg)`; return r; };
  L(23, 25, 320, -3); L(26, 28, 440, 2);
  seq(s, 360, 560, 29, 30, { font: SANS(54), color: '#ffffff' });
  seq(s, 360, 680, 31, 31, { font: FONTS.serif(100), ...KEY });
  seq(s, 360, 805, 32, 33, { font: FONTS.serif(88), ...KEY });
  const clk = el('div', 'abs', s.el); clk.setAttribute('data-evitar', 'relogio');
  clk.style.cssText = `left:360px;top:1020px;width:170px;height:170px;border:8px solid ${CLARO};border-radius:50%;background:rgba(0,0,0,.4)`;
  clk.innerHTML = `<div style="position:absolute;left:73px;top:30px;width:8px;height:52px;background:${CLARO};transform-origin:4px 52px;transform:rotate(-60deg);border-radius:4px"></div>
    <div class="m" style="position:absolute;left:75px;top:14px;width:4px;height:68px;background:${COR};transform-origin:2px 68px;border-radius:2px"></div>`;
  const hand = clk.querySelector('.m');
  s.updates.push(t => {
    const p = pop(t, ws(31), 0.4); clk.style.opacity = t > ws(31) ? 1 : 0; clk.style.transform = `translate(-50%,-50%) scale(${p})`;
    const stop = we(33), a0 = Math.max(0, t - ws(31));
    hand.style.transform = `rotate(${t < stop ? a0 * 720 : (stop - ws(31)) * 720 + Math.sin((t - stop) * 40) * 6 * Math.max(0, 1 - (t - stop) * 3)}deg)`;
  });
}
/* 5 — xenofobia */
{
  const s = scene(C[4], C[5], '#000', 0.03);
  collage(s, 'celular.jpg', { z0: 1.05, z1: 1.25 });
  seq(s, 360, 420, 34, 35, { font: SANS(58), color: '#ffffff' });
  seq(s, 360, 530, 36, 37, { font: SANS(58), color: '#ffffff' });
  const r = seq(s, 360, 690, 38, 38, { font: FONTS.caps(132), ...KEY });
  r.extra = t => t > ws(38) ? `translate(${Math.sin(t * 60) * 4}px, 0)` : '';
  s.updates.push(t => {
    const sp = r.items[0].sp; const g = t > ws(38) && (Math.floor(t * 12) % 5 === 0);
    if (t > ws(38) + 0.3) sp.style.textShadow = g ? '-7px 0 rgba(0,255,255,.7), 7px 0 rgba(255,0,60,.8)' : '0 0 30px rgba(227,20,27,.55)';
  });
  const bub = [[150, 900, '1f621'], [570, 880, '1f624'], [250, 1070, '1f92c'], [490, 1080, '1f621']];
  bub.forEach(([x, y, c], k) => {
    const b = el('div', 'abs', s.el, `<img src="${tw(c)}" style="width:70px;height:70px;display:block">`);
    b.style.cssText = `left:${x}px;top:${y}px;padding:14px;background:#fff;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.5)`;
    s.updates.push(t => { const t0 = ws(38) + 0.15 + k * 0.18; const p = pop(t, t0, 0.35); b.style.opacity = t > t0 ? 1 : 0; b.style.transform = `translate(-50%,-50%) scale(${p}) translateY(${Math.sin(t * 3 + k) * 6}px)`; });
  });
}
/* 6 — prefeituras na briga */
{
  const s = scene(C[5], C[6], 'radial-gradient(ellipse at 50% 40%, #6d0d12 0%, #2a0505 75%)', 0.025);
  el('div', 'ht', s.el); interrog(s, 2);
  seq(s, 360, 400, 39, 39, { font: FONTS.caps(110), color: CLARO });
  seq(s, 360, 540, 40, 41, { font: SANS(58), color: '#ffffff' });
  seq(s, 360, 660, 42, 44, { font: SANS(58), color: '#ffffff' }, { 44: { font: FONTS.serif(80), ...KEY } });
  const pins = [[150, 860], [300, 930], [460, 850], [590, 950], [220, 1070], [400, 1100], [540, 1090]];
  pins.forEach(([x, y], k) => {
    const p = el('img', 'abs', s.el); p.src = tw('1f4cd'); p.style.cssText = `left:${x}px;top:${y}px;width:72px;height:72px`;
    s.updates.push(t => { const t0 = ws(39) + k * 0.16; const q = prog(t, t0, t0 + 0.35); p.style.opacity = t > t0 ? 1 : 0; p.style.transform = `translate(-50%,-100%) translateY(${(1 - backOut(q)) * -220}px)`; });
  });
}
/* 7 — Ministério da Cultura */
{
  const s = scene(C[6], C[7], '#000', 0.02);
  collage(s, 'brasilia.jpg', { z0: 1.25, z1: 1.05, py: 20 });
  seq(s, 360, 380, 45, 47, { font: SANS(56), color: '#ffffff' });
  seq(s, 360, 510, 48, 48, { font: FONTS.caps(104), color: CLARO });
  seq(s, 360, 650, 49, 50, { font: FONTS.caps(104), color: CLARO });
  seq(s, 360, 790, 51, 52, { font: SANS(58), color: '#ffffff' }, { 52: { font: FONTS.serif(84), ...KEY } });
}
/* 8 — audiência caiu */
{
  const s = scene(C[7], C[8], '#000', 0.02);
  collage(s, 'audiencia.jpg', { z0: 1.05, z1: 1.2 });
  seq(s, 360, 330, 53, 55, { font: FONTS.type(46), color: CLARO });
  seq(s, 360, 440, 56, 57, { font: SANS(58), color: '#ffffff' });
  const r = seq(s, 360, 610, 58, 58, { font: FONTS.caps(170), ...KEY });
  r.extra = tt => tt > ws(58) ? `translateY(${easeOut(prog(tt, ws(58), ws(58) + 0.4)) * 14}px)` : '';
  seq(s, 360, 790, 59, 60, { font: SANS(56), color: '#ffffff' });
  seq(s, 360, 890, 61, 61, { font: SANS(56), color: '#ffffff' });
  const ar = el('div', 'abs', s.el, '<svg width="140" height="170" viewBox="0 0 160 180"><path d="M80 10 V150 M25 100 L80 160 L135 100" fill="none" stroke="#e3141b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  ar.setAttribute('data-evitar', 'seta');
  ar.style.cssText = 'left:360px;top:1070px';
  s.updates.push(t => { const q = prog(t, ws(58), ws(58) + 0.5); ar.style.opacity = t > ws(58) ? 1 : 0; ar.style.transform = `translate(-50%,-50%) translateY(${lerp(-60, 0, easeOut(q)) + Math.sin(t * 6) * 8}px)`; });
}
/* 9 — a virada */
{
  const s = scene(C[8], C[9], 'radial-gradient(ellipse at 50% 45%, #7a0b10 0%, #1a0202 75%)', 0.03);
  el('div', 'ht', s.el); interrog(s, 3);
  seq(s, 360, 330, 62, 64, { font: SANS(58), color: '#ffffff' });
  seq(s, 360, 470, 65, 65, { font: FONTS.serif(140), color: CLARO, glow: 'rgba(255,255,255,.25)' });
  seq(s, 360, 630, 66, 67, { font: SANS(58), color: '#ffffff' }, { 67: { font: FONTS.caps(80), color: CLARO } });
  carimbo(s, 'RECUOU', 360, 960, ws(68), -7, 110);
}
/* 10 — diretor de dramaturgia */
{
  const s = scene(C[9], C[10], '#000', 0.02);
  collage(s, 'estudio.jpg', { z0: 1.1, z1: 1.3, px: -20 });
  seq(s, 360, 300, 69, 71, { font: SANS(54), color: '#ffffff' });
  seq(s, 360, 410, 72, 72, { font: FONTS.caps(90), color: CLARO });
  seq(s, 360, 530, 73, 73, { font: SANS(54), color: '#ffffff' });
  seq(s, 360, 650, 74, 74, { font: FONTS.serif(100), ...KEY });
  seq(s, 360, 780, 75, 78, { font: SANS(54), color: '#ffffff' });
  const lb = el('div', 'abs', s.el, `<div style="font:400 30px Anton;color:#1a0505;letter-spacing:.03em">JOSÉ LUIZ VILLAMARIM</div><div style="font:600 20px Inter;color:#5a0a0e">diretor de Dramaturgia da Globo</div>`);
  lb.setAttribute('data-evitar', 'etiqueta');
  lb.style.cssText = `left:360px;top:960px;white-space:nowrap;background:${CLARO};padding:12px 26px;border-left:10px solid ${COR};box-shadow:0 14px 40px rgba(0,0,0,.6)`;
  s.updates.push(t => { const q = prog(t, ws(70), ws(70) + 0.4); lb.style.opacity = t > ws(70) ? 1 : 0; lb.style.transform = `translate(-50%,-50%) translateX(${(1 - easeOutExpo(q)) * 500}px) rotate(-2deg)`; });
}
/* 11 — Dira Paes pede desculpas */
{
  const s = scene(C[10], C[11], 'radial-gradient(ellipse at 50% 40%, #4a080b 0%, #120101 75%)', 0.02);
  el('div', 'ht', s.el);
  let qy = 860;
  if (FOTO_DIRA) {
    const pol = el('div', 'abs', s.el, `<div style="width:290px;height:320px;overflow:hidden"><img src="${A + FOTO_DIRA.src}" style="width:100%;height:100%;object-fit:cover;object-position:${FOTO_DIRA.pos || '50% 25%'}"></div>
      <div style="font:400 40px/58px Anton;color:#1a0505;text-align:center">DIRA PAES</div>`);
    pol.setAttribute('data-evitar', 'foto');
    pol.style.cssText = 'left:360px;top:400px;padding:16px 16px 6px;background:#f4efe6;box-shadow:0 24px 60px rgba(0,0,0,.7)';
    s.updates.push(t => { const p = pop(t, s.start + 0.05, 0.45); pol.style.transform = `translate(-50%,-50%) rotate(${lerp(12, -4, clamp(p))}deg) scale(${p})`; });
    credito(s, 'Foto: ' + FOTO_DIRA.credito);
    seq(s, 360, 690, 79, 83, { font: SANS(50), color: '#ffffff' }, { 83: { font: SANS(50), color: COR } });
    qy = 860;
  } else {
    seq(s, 360, 440, 79, 81, { font: FONTS.caps(120), color: CLARO }, { 79: { font: SANS(56), color: '#ffffff' } });
    seq(s, 360, 600, 82, 83, { font: SANS(56), color: '#ffffff' }, { 83: { font: FONTS.serif(76), ...KEY } });
  }
  const aspas = el('div', 'abs', s.el, '“'); aspas.style.cssText = `left:90px;top:${qy - 40}px;font:900 italic 200px/1 Play;color:${COR};opacity:0`;
  s.updates.push(t => { const p = pop(t, ws(84) - 0.1, 0.35); aspas.style.opacity = t > ws(84) - 0.1 ? .9 : 0; aspas.style.transform = `translate(-50%,-50%) scale(${p})`; });
  seq(s, 360, qy, 84, 85, { font: FONTS.dms(66, true), color: CLARO, text: { 84: 'Ofender' } });
  seq(s, 360, qy + 95, 86, 88, { font: FONTS.dms(66, true), color: CLARO }, { 88: { font: FONTS.dms(66, true), color: COR } });
}
/* 12 — CTA com enquete */
{
  const s = scene(C[11], DUR, 'radial-gradient(ellipse at 50% 45%, #2a0606 0%, #070101 72%)', 0.01);
  el('div', 'ht', s.el);
  seq(s, 360, 250, 89, 90, { font: FONTS.serif(110), color: CLARO, text: { 89: 'E', 90: 'aí?' } });
  seq(s, 360, 400, 91, 92, { font: SANS(54), color: '#ffffff' });
  seq(s, 360, 490, 93, 93, { font: FONTS.caps(72), ...KEY, text: { 93: 'EXAGEROU' } });
  seq(s, 360, 590, 94, 96, { font: SANS(54), color: '#ffffff' });
  seq(s, 360, 680, 97, 97, { font: FONTS.caps(72), ...KEY, text: { 97: 'EXAGEROU?' } });
  const poll = el('div', 'abs', s.el, `<div style="font:800 24px Inter;color:#111;text-align:center;margin-bottom:14px;letter-spacing:.06em">QUEM EXAGEROU?</div>
    <div style="position:relative;height:64px;border-radius:14px;background:#eee;margin-bottom:12px;overflow:hidden"><div class="b1" style="position:absolute;left:0;top:0;bottom:0;width:0;background:#f6b3b5"></div><div style="position:relative;font:700 26px/64px Inter;padding-left:20px;color:#111">📺 A Globo</div></div>
    <div style="position:relative;height:64px;border-radius:14px;background:#eee;overflow:hidden"><div class="b2" style="position:absolute;left:0;top:0;bottom:0;width:0;background:#f6b3b5"></div><div style="position:relative;font:700 26px/64px Inter;padding-left:20px;color:#111">📱 A internet</div></div>`);
  poll.setAttribute('data-evitar', 'enquete');
  poll.style.cssText = 'left:360px;top:900px;width:440px;padding:22px;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.6)';
  const b1 = poll.querySelector('.b1'), b2 = poll.querySelector('.b2');
  const tp = we(97) + 0.05;
  s.updates.push(t => { const p = pop(t, tp, 0.4); poll.style.opacity = t > tp ? 1 : 0; poll.style.transform = `translate(-50%,-50%) scale(${p}) rotate(-2deg)`;
    const q = easeOut(prog(t, tp + 0.5, tp + 1.6)); b1.style.width = (q * 58) + '%'; b2.style.width = (q * 42) + '%'; });
  seq(s, 360, 1150, 98, 99, { font: FONTS.hand(64), color: CLARO, text: { 99: 'aqui 👇' } });
}

/* selo fixo no topo */
{
  const tag = el('div', 'abs', stage, 'POLÊMICA NA TV');
  tag.style.cssText = `left:360px;top:110px;transform:translate(-50%,-50%);white-space:nowrap;font:400 30px Anton;letter-spacing:.12em;color:${CLARO};background:${COR};padding:6px 22px 6px 46px`;
  const dot = el('div', '', tag); dot.style.cssText = 'position:absolute;left:20px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff';
  globalUpdate = t => { dot.style.opacity = (Math.floor(t * 2) % 2) ? 1 : 0.2; };
}

finalize({ duration: DUR, grain: 0.09, vignette: 0.55, flashes: C.slice(1).map(t => [t, 0.12, '227,20,27']),
  preload: ['estudio.jpg', 'sertao.jpg', 'tv.jpg', 'celular.jpg', 'brasilia.jpg', 'audiencia.jpg'].map(f => A + f) });
</script>
</body></html>
